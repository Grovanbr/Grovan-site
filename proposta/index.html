<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua proposta | Grovan</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Proposta personalizada da Grovan Soluções para o seu negócio.">

  <!-- Aplica o tema salvo antes de desenhar a página (evita piscar) -->
  <script>
    try {
      var tema = localStorage.getItem("grovan-tema");
      if (!tema) tema = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
      document.documentElement.dataset.tema = tema;
    } catch (e) {}
  </script>
  <link rel="icon" href="../img/grovan-perfil-icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ===== Página de proposta (cores da Grovan, tema claro e escuro) ===== */
    :root{--pv-verde:#0F3D2E;--pv-lima:#B8E35A;--pv-creme:#F6F5F0;--pv-texto:#1B2A22;--pv-suave:#5B6B62;--pv-linha:rgba(15,61,46,.14);--pv-card:rgba(255,255,255,.75);--pv-fundo-lima:#E7F3CC;--pv-fundo:#F6F5F0}
    [data-tema="escuro"]{--pv-texto:#EAF0EC;--pv-suave:#A9B8AF;--pv-linha:rgba(246,245,240,.14);--pv-card:rgba(255,255,255,.04);--pv-fundo-lima:rgba(184,227,90,.14);--pv-fundo:#0E1A15}
    .pv{padding-block:8px 96px}
    .pv-sec{margin-top:44px}
    .pv-sec>h2{font-family:Sora,sans-serif;font-size:clamp(21px,2.4vw,26px);margin:0 0 6px;text-wrap:balance}
    .pv-sub{margin:0 0 18px;color:var(--pv-suave);max-width:62ch}
    .pv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
    .pv-card{border:1px solid var(--pv-linha);border-radius:18px;padding:18px;background:var(--pv-card);display:flex;flex-direction:column;gap:8px;min-width:0}
    .pv-card h3{font-family:Sora,sans-serif;font-size:16.5px;margin:0}
    .pv-card p{margin:0;line-height:1.6;color:var(--pv-suave);font-size:14.5px}
    .pv-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--pv-fundo-lima);color:var(--pv-verde);font-weight:800}
    [data-tema="escuro"] .pv-ico{color:var(--pv-lima)}
    .pv-pontos{list-style:none;margin:0;padding:0;display:grid;gap:10px}
    .pv-pontos li{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--pv-linha);border-radius:14px;padding:12px 14px;background:var(--pv-card);line-height:1.55}
    .pv-pontos li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--pv-lima);margin-top:7px;box-shadow:0 0 0 4px var(--pv-fundo-lima)}
    .pv-trab img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--pv-fundo-lima)}
    .pv-selo{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--pv-fundo-lima);color:var(--pv-verde)}
    [data-tema="escuro"] .pv-selo{color:var(--pv-lima)}
    /* orçamento */
    .pv-orc{border:1px solid var(--pv-linha);border-radius:22px;padding:clamp(16px,3vw,26px);background:var(--pv-card);display:grid;gap:16px}
    .pv-doc{display:grid;gap:10px;background:var(--pv-verde);color:var(--pv-creme);border-radius:18px;padding:20px}
    .pv-doc b{font-family:Sora,sans-serif;font-size:17px}
    .pv-doc p{margin:0;color:#CFE0D6;font-size:14.5px;line-height:1.55}
    .pv-doc form{display:flex;gap:8px;flex-wrap:wrap}
    .pv-doc input{flex:1 1 220px;min-width:0;padding:13px 14px;border-radius:12px;border:0;font:inherit;font-size:16px}
    .pv-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font:700 15px Inter,sans-serif;cursor:pointer;background:var(--pv-lima);color:#1F3A0E;text-decoration:none}
    .pv-btn:disabled{opacity:.55;cursor:not-allowed}
    .pv-btn.sec{background:transparent;color:inherit;border:1px solid var(--pv-linha)}
    .pv-item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--pv-linha)}
    .pv-item:last-child{border-bottom:0}
    .pv-item input{width:20px;height:20px;margin-top:3px;accent-color:var(--pv-verde);flex:none}
    .pv-item label{flex:1;min-width:0;cursor:pointer}
    .pv-item b{display:block}
    .pv-item small{color:var(--pv-suave);display:block;line-height:1.5}
    .pv-preco{flex:none;text-align:right;font-weight:700;white-space:nowrap}
    .pv-preco small{font-weight:500}
    .pv-mais summary{cursor:pointer;font-weight:600;padding:6px 0}
    .pv-mais h4{margin:14px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--pv-suave)}
    .pv-total{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;border-top:2px solid var(--pv-linha);padding-top:14px}
    .pv-total .v{font:800 clamp(22px,3vw,28px) Sora,sans-serif}
    .pv-total small{display:block;color:var(--pv-suave)}
    .pv-aviso{border-radius:14px;padding:14px 16px;background:var(--pv-fundo-lima);line-height:1.55}
    .pv-erro{color:#c0392b;font-size:14px;margin:0}
    /* chat flutuante */
    .pv-bolha{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:inline-flex;align-items:center;gap:10px;background:var(--pv-verde);color:var(--pv-creme);border:0;border-radius:999px;padding:14px 20px 14px 16px;font:700 15px Inter,sans-serif;box-shadow:0 14px 30px -12px rgba(15,61,46,.6);cursor:pointer}
    .pv-bolha i{width:10px;height:10px;border-radius:50%;background:var(--pv-lima)}
    .pv-bolha .n{background:var(--pv-lima);color:#1F3A0E;border-radius:999px;padding:1px 8px;font-size:12px}
    .pv-chat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:61;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100dvh - 32px));display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--pv-fundo);color:var(--pv-texto);border:1px solid var(--pv-linha);box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
    .pv-chat header{display:flex;align-items:center;gap:10px;background:var(--pv-verde);color:var(--pv-creme);padding:14px 16px}
    .pv-chat header b{font-family:Sora,sans-serif;display:block}
    .pv-chat header small{color:#CFE0D6}
    .pv-chat header button{margin-left:auto;background:transparent;border:0;color:inherit;font-size:22px;cursor:pointer;line-height:1}
    .pv-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
    .pv-m{max-width:85%;padding:9px 12px;border-radius:14px;line-height:1.5;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
    .pv-m.ela{background:var(--pv-card);border:1px solid var(--pv-linha);align-self:flex-start}
    .pv-m.eu{background:var(--pv-verde);color:var(--pv-creme);align-self:flex-end}
    .pv-m small{display:block;font-size:11.5px;opacity:.7;margin-bottom:2px}
    .pv-m a{color:inherit}
    .pv-chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--pv-linha)}
    .pv-chat textarea{flex:1;min-width:0;resize:none;border-radius:12px;border:1px solid var(--pv-linha);padding:10px;font:inherit;font-size:15px;background:transparent;color:inherit;max-height:110px}
    .pv-sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
    .pv-sug button{border:1px solid var(--pv-linha);background:transparent;color:inherit;border-radius:999px;padding:6px 11px;font:500 13px Inter,sans-serif;cursor:pointer}
    .pv-chat[hidden],.pv-bolha[hidden],.pv-sug[hidden],.pv-bolha .n[hidden]{display:none!important}
    .pv-carregando{padding:60px 0;text-align:center;color:var(--pv-suave)}
    @media (prefers-reduced-motion:no-preference){.pv-card,.pv-pontos li{animation:pvEntra .5s ease-out both}}
    @keyframes pvEntra{from{transform:translateY(8px)}to{transform:none}}
  </style>
</head>
<body>

  <!-- ===== Cabeçalho (igual em todas as páginas) ===== -->
  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <a href="../">
        <img src="../img/grovan-logo.png" alt="Grovan" class="logo logo-tema-claro">
        <img src="../img/grovan-logo-claro.png" alt="Grovan" class="logo logo-tema-escuro">
      </a>
      <div class="cabecalho-direita">
        <nav class="menu" aria-label="Menu principal">
          <a href="../">Achados</a>
          <a href="../sobre/">Sobre</a>
          <a href="../contato/">Contato</a>
        </nav>
        <button type="button" class="botao-tema" aria-label="Mudar para o tema escuro" aria-pressed="false">
          <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main>
    <section class="pagina-topo">
      <div class="container">
        <span class="etiqueta">Proposta personalizada</span>
        <h1 id="pv-titulo">Preparando a sua proposta…</h1>
        <p class="inicio-texto" id="pv-abertura"></p>
      </div>
    </section>

    <section class="pv">
      <div class="container" id="pv-corpo"><p class="pv-carregando" role="status">Carregando…</p></div>
    </section>
  </main>

  <button type="button" class="pv-bolha" id="pv-bolha" aria-controls="pv-chat" aria-expanded="false"><i aria-hidden="true"></i> Dúvidas? Fale com a gente <span class="n" id="pv-n" hidden></span></button>
  <div class="pv-chat" id="pv-chat" role="dialog" aria-label="Conversa com a Grovan" hidden>
    <header><div><b>Grovan Soluções</b><small>Assistente virtual · o Cristian entra quando precisar</small></div><button type="button" id="pv-fechar" aria-label="Fechar conversa">×</button></header>
    <div class="pv-msgs" id="pv-msgs" aria-live="polite"></div>
    <div class="pv-sug" id="pv-sug">
      <button type="button">Como funciona o pagamento?</button>
      <button type="button">Quanto tempo leva?</button>
      <button type="button">Quero falar com o Cristian</button>
    </div>
    <form id="pv-form"><label class="sr-only" for="pv-txt" style="position:absolute;left:-9999px">Sua mensagem</label><textarea id="pv-txt" rows="1" placeholder="Escreva sua dúvida ou pedido"></textarea><button class="pv-btn" type="submit">Enviar</button></form>
  </div>

  <script>
  /* ===== CONFIGURAÇÃO (valores públicos: só permitem chamar a função "proposta") ===== */
  const CONFIG={supabaseUrl:"https://gemsxocgwkpkgapgflkt.supabase.co",anonKey:"sb_publishable_CIgMVDHTDKmTEfzttKyCqA_WktHZV13",funcao:"proposta"};
  /* =================================================================================== */
  const $=q=>document.querySelector(q);
  const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const brl=n=>"R$ "+Number(n).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2});
  const linkar=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const P=new URLSearchParams(location.search).get("p");
  let D=null,SEL=new Set(),ultimo=0,naoLidas=0,timer=null;

  async function api(acao,dados={}){
    const r=await fetch(`${CONFIG.supabaseUrl}/functions/v1/${CONFIG.funcao}`,{method:"POST",
      headers:{"content-type":"application/json",apikey:CONFIG.anonKey,...(CONFIG.anonKey.startsWith("eyJ")?{authorization:"Bearer "+CONFIG.anonKey}:{})},
      body:JSON.stringify({acao,p:P,...dados})}).catch(()=>null);
    if(!r)throw new Error("Sem conexão. Confira a internet e tente de novo.");
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.erro||"Algo deu errado. Tente de novo em instantes.");
    return j;
  }

  // ---------- página
  async function iniciar(){
    if(!P){$("#pv-titulo").textContent="Link incompleto";$("#pv-corpo").innerHTML='<p class="pv-aviso">Abra o link exatamente como você recebeu no WhatsApp.</p>';return}
    try{D=await api("abrir")}catch(e){$("#pv-titulo").textContent="Não encontramos esta proposta";$("#pv-corpo").innerHTML=`<p class="pv-aviso">${esc(e.message)}</p>`;return}
    SEL=new Set(D.selecionados||[]);
    document.title=`Proposta para ${D.empresa} | Grovan`;
    $("#pv-titulo").textContent=`Proposta para ${D.empresa}`;
    $("#pv-abertura").textContent=D.conteudo?.abertura||"";
    desenhar();
    (D.mensagens||[]).forEach(m=>addMsg(m));
    if(!(D.mensagens||[]).length)addMsg({autor:"ia",texto:`Olá! Sou a assistente virtual da Grovan. Posso tirar dúvidas sobre esta proposta, explicar os serviços ou incluir algo no orçamento. É só escrever. 😊`},true);
    timer=setInterval(novidades,10000);
  }
  function cat(id){return D.catalogo.find(c=>c.id===id)}
  function preco(s){
    if(!D.identificado)return "";
    if(s.a_combinar)return `A combinar<small>${brl(s.valor_hora)}/hora</small>`;
    return s.cobranca==="Mensal"?`${brl(s.valor)}<small>/mês</small>`:brl(s.valor);
  }
  function itemHtml(s,sug){
    const porque=sug?(D.conteudo?.servicos||[]).find(x=>x.id===s.id)?.porque:"";
    return `<div class="pv-item"><input type="checkbox" id="sv${s.id}" data-id="${s.id}" ${SEL.has(s.id)?"checked":""} ${travado()?"disabled":""}>
      <label for="sv${s.id}"><b>${esc(s.nome)}</b><small>${esc(porque||s.entrega||s.inclui||"")}</small></label><span class="pv-preco">${preco(s)}</span></div>`;
  }
  const travado=()=>["aguardando_pagamento","paga","em_andamento","concluida"].includes(D.situacao);
  function desenhar(){
    const sug=(D.sugeridos||[]).map(cat).filter(Boolean);
    const pontos=(D.conteudo?.pontos||[]).filter(Boolean);
    const extras=D.catalogo.filter(c=>!D.sugeridos.includes(c.id)&&SEL.has(c.id)); // incluídos pelo cliente ou pela conversa
    const outros=D.catalogo.filter(c=>!D.sugeridos.includes(c.id)&&!SEL.has(c.id));
    const porCat={};outros.forEach(c=>(porCat[c.categoria]=porCat[c.categoria]||[]).push(c));
    $("#pv-corpo").innerHTML=`
      ${pontos.length?`<div class="pv-sec" style="margin-top:8px"><h2>O que vimos no seu negócio</h2><p class="pv-sub">Uma olhada rápida na presença da ${esc(D.empresa)} na internet.</p><ul class="pv-pontos">${pontos.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
      ${sug.length?`<div class="pv-sec"><h2>O que a Grovan faria</h2><p class="pv-sub">Os serviços que mais fazem sentido para vocês agora.</p>
        <div class="pv-grid">${sug.map((s,i)=>`<article class="pv-card"><span class="pv-ico" aria-hidden="true">${i+1}</span><h3>${esc(s.nome)}</h3><p>${esc((D.conteudo?.servicos||[]).find(x=>x.id===s.id)?.porque||s.inclui)}</p></article>`).join("")}</div></div>`:""}
      ${(D.trabalhos||[]).length?`<div class="pv-sec"><h2>Trabalhos parecidos</h2><p class="pv-sub">Exemplos do que fazemos.</p>
        <div class="pv-grid">${D.trabalhos.map(t=>`<article class="pv-card pv-trab">${t.imagem_url?`<img src="${esc(t.imagem_url)}" alt="${esc(t.titulo)}" loading="lazy">`:""}${t.conceito?'<span class="pv-selo">Projeto conceito</span>':""}<h3>${esc(t.titulo)}</h3>${t.descricao?`<p>${esc(t.descricao)}</p>`:""}${t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener">Ver o trabalho →</a>`:""}</article>`).join("")}</div></div>`:""}
      <div class="pv-sec" id="orcamento"><h2>Seu orçamento</h2><p class="pv-sub">Os serviços sugeridos já estão marcados. Desmarque o que não quiser ou inclua outros.</p>
        <div class="pv-orc">
          ${D.identificado?"":`<div class="pv-doc"><b>Veja os valores para a sua empresa</b><p>Informe o CNPJ (ou o CPF, se for pessoa física). Usamos só para calcular o orçamento certo.</p>
            <form id="pv-docf"><label for="pv-doc" style="position:absolute;left:-9999px">CNPJ ou CPF</label><input id="pv-doc" inputmode="numeric" autocomplete="off" placeholder="CNPJ ou CPF"><button class="pv-btn" type="submit">Ver valores</button></form><p class="pv-erro" id="pv-docerro" role="alert"></p></div>`}
          ${situacaoHtml()}
          <div>${sug.map(s=>itemHtml(s,true)).join("")}${extras.map(s=>itemHtml(s,false)).join("")}</div>
          <details class="pv-mais"><summary>Incluir outros serviços</summary>${Object.entries(porCat).map(([c,l])=>`<h4>${esc(c)}</h4>${l.map(s=>itemHtml(s,false)).join("")}`).join("")}</details>
          <div class="pv-total" id="pv-total"></div>
        </div></div>`;
    $("#pv-corpo").querySelectorAll(".pv-item input").forEach(i=>i.addEventListener("change",()=>{i.checked?SEL.add(+i.dataset.id):SEL.delete(+i.dataset.id);total();salvarSel()}));
    $("#pv-docf")?.addEventListener("submit",identificar);
    total();
  }
  function situacaoHtml(){
    if(D.situacao==="aguardando_pagamento"&&D.pagamento)return `<div class="pv-aviso">Proposta aprovada! Falta só o pagamento. <a class="pv-btn" style="margin-top:10px" href="${esc(D.pagamento)}">Pagar agora</a></div>`;
    if(["paga","em_andamento","concluida"].includes(D.situacao))return `<div class="pv-aviso">Pagamento confirmado. Obrigado! ${D.acompanhar?`<a href="${esc(D.acompanhar)}">Acompanhe o andamento aqui</a>.`:""}</div>`;
    if(D.situacao==="nova")return `<div class="pv-aviso">Recebemos sua aprovação. O Cristian vai confirmar os itens sob medida e te mandar o link de pagamento.</div>`;
    return "";
  }
  function total(){
    const l=[...SEL].map(cat).filter(Boolean);
    let u=0,m=0,c=0;l.forEach(s=>{if(s.a_combinar)c++;else if(s.cobranca==="Mensal")m+=s.valor||0;else u+=s.valor||0});
    const el=$("#pv-total");if(!el)return;
    if(!D.identificado){el.innerHTML=`<div><small>${l.length} serviço(s) marcado(s)</small>Informe o CNPJ ou CPF para ver o total.</div>`;return}
    el.innerHTML=`<div><small>Total${m?" (projeto + 1ª mensalidade)":""}</small><span class="v">${brl(u+m)}</span>${m?`<small>${brl(u)} do projeto + ${brl(m)}/mês</small>`:""}${c?`<small>+ ${c} item(ns) a combinar com o Cristian</small>`:""}</div>
      ${travado()?"":`<button class="pv-btn" id="pv-aprovar" type="button" ${l.length?"":"disabled"}>${c?"Aprovar e enviar ao Cristian":"Aprovar e pagar"}</button>`}`;
    $("#pv-aprovar")?.addEventListener("click",aprovar);
  }
  let selT=null;
  function salvarSel(){clearTimeout(selT);selT=setTimeout(()=>api("selecionar",{ids:[...SEL]}).catch(()=>{}),600)}
  async function identificar(e){
    e.preventDefault();const b=e.submitter;b.disabled=true;$("#pv-docerro").textContent="";
    try{await api("identificar",{documento:$("#pv-doc").value});D=await api("abrir");SEL=new Set(D.selecionados||[...SEL]);desenhar();$("#orcamento").scrollIntoView({behavior:"smooth"})}
    catch(err){$("#pv-docerro").textContent=err.message;b.disabled=false}
  }
  async function aprovar(e){
    const b=e.currentTarget;b.disabled=true;b.textContent="Gerando…";
    try{const r=await api("aprovar",{ids:[...SEL]});
      if(r.link){location.href=r.link;return}
      if(r.combinar){D.situacao="nova";desenhar();addMsg({autor:"ia",texto:r.mensagem},true);abrirChat()}
    }catch(err){alertaOrc(err.message);b.disabled=false;b.textContent="Aprovar e pagar"}
  }
  function alertaOrc(t){const el=$("#pv-total");el.insertAdjacentHTML("beforeend",`<p class="pv-erro" role="alert" style="width:100%">${esc(t)}</p>`)}

  // ---------- chat
  function addMsg(m,local){
    if(m.id){if(m.id<=ultimo)return;ultimo=m.id}
    const eu=m.autor==="cliente";
    $("#pv-msgs").insertAdjacentHTML("beforeend",`<div class="pv-m ${eu?"eu":"ela"}">${eu?"":`<small>${m.autor==="cristian"?"Cristian":"Assistente Grovan"}</small>`}${linkar(m.texto)}</div>`);
    const box=$("#pv-msgs");box.scrollTop=box.scrollHeight;
    if(!eu&&$("#pv-chat").hidden&&!local){naoLidas++;$("#pv-n").textContent=naoLidas;$("#pv-n").hidden=false}
  }
  function abrirChat(){$("#pv-chat").hidden=false;$("#pv-bolha").hidden=true;$("#pv-bolha").setAttribute("aria-expanded","true");naoLidas=0;$("#pv-n").hidden=true;setTimeout(()=>$("#pv-txt").focus(),50);const box=$("#pv-msgs");box.scrollTop=box.scrollHeight}
  function fecharChat(){$("#pv-chat").hidden=true;$("#pv-bolha").hidden=false;$("#pv-bolha").setAttribute("aria-expanded","false");$("#pv-bolha").focus()}
  async function enviar(texto){
    texto=texto.trim();if(!texto||!D)return;
    $("#pv-msgs").insertAdjacentHTML("beforeend",`<div class="pv-m eu">${esc(texto)}</div>`);
    const dig=document.createElement("div");dig.className="pv-m ela";dig.textContent="digitando…";$("#pv-msgs").appendChild(dig);$("#pv-msgs").scrollTop=1e9;
    $("#pv-sug").hidden=true;
    try{const r=await api("mensagem",{texto,ids:[...SEL]});dig.remove();
      await novidades(true); // a resposta da IA vem do servidor (assim não aparece duas vezes)
      if(!r.resposta)$("#pv-msgs").insertAdjacentHTML("beforeend",`<div class="pv-m ela"><small>Grovan</small>Recebido! O Cristian responde por aqui e pelo seu WhatsApp.</div>`);
      (r.adicionar||[]).forEach(id=>SEL.add(id));if((r.adicionar||[]).length){desenhar();salvarSel()}
      $("#pv-msgs").scrollTop=1e9;
    }catch(err){dig.textContent=err.message}
  }
  async function novidades(forcar){
    if((document.hidden&&!forcar)||!D)return;
    try{const n=await api("novidades",{desde:ultimo});n.mensagens.filter(m=>m.autor!=="cliente").forEach(m=>addMsg(m));n.mensagens.forEach(m=>ultimo=Math.max(ultimo,m.id));
      if(n.situacao&&n.situacao!==D.situacao){D.situacao=n.situacao;D.pagamento=n.pagamento;desenhar()}}catch(e){}
  }
  $("#pv-bolha").addEventListener("click",abrirChat);
  $("#pv-fechar").addEventListener("click",fecharChat);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#pv-chat").hidden)fecharChat()});
  $("#pv-form").addEventListener("submit",e=>{e.preventDefault();const t=$("#pv-txt").value;$("#pv-txt").value="";enviar(t)});
  $("#pv-txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#pv-form").requestSubmit()}});
  $("#pv-sug").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{abrirChat();enviar(b.textContent)}));
  iniciar();
  </script>
