<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Grovan Soluções</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app de conversa em tela cheia — cabeçalho da marca, conversa rolando, campo de mensagem fixo embaixo; catálogo abre por cima */
:root{
  --bg:#F6F5F0; --surface:#FFFFFF; --sunk:#ECEBE3; --line:#E2E2DA;
  --fg:#14171A; --muted:#5A635E; --brand:#0F3D2E; --brand-fg:#F6F5F0; --sprout:#B8E35A; --sprout-ink:#1F3A0E;
  --mine:#0F3D2E; --mine-fg:#F6F5F0; --ok:#2F6B4F;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1411; --surface:#14201B; --sunk:#1B2A23; --line:#26372F;
  --fg:#EEF1EC; --muted:#A3B0A9; --brand:#0F3D2E; --brand-fg:#F6F5F0; --sprout:#B8E35A; --sprout-ink:#1F3A0E;
  --mine:#B8E35A; --mine-fg:#14171A; --ok:#8FD3A9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#14201B; --sunk:#1B2A23; --line:#26372F;
  --fg:#EEF1EC; --muted:#A3B0A9; --brand:#0F3D2E; --brand-fg:#F6F5F0; --sprout:#B8E35A; --sprout-ink:#1F3A0E;
  --mine:#B8E35A; --mine-fg:#14171A; --ok:#8FD3A9; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.app{height:100%;display:flex;flex-direction:column}
header{background:var(--brand);color:var(--brand-fg);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font:700 22px var(--f-display);letter-spacing:-.5px}
.hin .tag{font-size:12.5px;color:#CFE0D6;margin-left:2px}
.sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid rgba(246,245,240,.25);background:transparent;color:var(--brand-fg);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(246,245,240,.1)}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sprout);outline-offset:2px}
main{flex:1;overflow-y:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.feed{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:11px 14px;min-width:0;overflow-wrap:anywhere}
.me .bub{background:var(--mine);color:var(--mine-fg);border-color:transparent;border-radius:16px 16px 4px 16px}
.bub p{margin:0}.bub p+p{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:600 14px var(--f-body);padding:10px 14px;min-height:44px;border-radius:12px;border:1.5px solid var(--brand);background:transparent;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
:root[data-theme="dark"] .chip{border-color:var(--sprout)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{border-color:var(--sprout)}}
.chip.pri{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.chip:hover{filter:brightness(1.05)}
.chip[disabled]{opacity:.45;cursor:default}
.idcard{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:8px}
.badge{display:inline-block;font:600 12px var(--f-body);padding:3px 10px;border-radius:99px;background:var(--sprout);color:var(--sprout-ink)}
.quote{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.quote .row{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--line)}
.quote .row:first-child{border-top:0}
.quote .row small{display:block;color:var(--muted);font-size:12px}
.quote .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.quote .tot{background:var(--sunk);font-weight:700}
.quote .tot .v{font:700 17px var(--f-display)}
.fine{font-size:12px;color:var(--muted);margin-top:8px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
footer.composer{border-top:1px solid var(--line);background:var(--surface);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cin{max-width:760px;margin:0 auto;display:flex;gap:8px}
.cin textarea{flex:1;min-width:0;resize:none;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;height:46px;max-height:140px}
.send{width:46px;height:46px;border-radius:12px;border:0;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center;cursor:pointer}
.send[disabled]{opacity:.4;cursor:default}
.form{display:grid;gap:8px;margin-top:10px}
.form label{font-size:12px;font-weight:600;color:var(--muted)}
.form input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
/* catálogo */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheet header .hin{gap:8px}
.sheet h2{font:700 18px var(--f-display);margin:0}
.cat{max-width:760px;margin:0 auto 18px}
.cat h3{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin:4px 0 8px}
.svc{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.svc.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
:root[data-theme="dark"] .svc.on{border-color:var(--sprout);box-shadow:0 0 0 1px var(--sprout) inset}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .svc.on{border-color:var(--sprout);box-shadow:0 0 0 1px var(--sprout) inset}}
.svc input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
.svc .nm{font-weight:600}
.svc .ds{color:var(--muted);font-size:13px}
.svc .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.svc .meta b{color:var(--fg);font-weight:600}
.svc .pr{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.svc .pr small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.qty{display:inline-flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;font-weight:700}
.sheetfoot{border-top:1px solid var(--line);background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sfin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sfin .sum{flex:1;min-width:0}
.sfin .sum b{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.demo{max-width:760px;margin:0 auto 4px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}}
</style>
<style>
.av-c{background:var(--sprout);color:var(--sprout-ink);font:700 15px var(--f-display)}
.bub .quem{font:600 12px var(--f-body);color:var(--ok);margin-bottom:2px}
.aviso{align-self:center;max-width:88%;text-align:center;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:99px;padding:5px 12px;margin:0}
.linkbox{margin-top:8px;background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:13px;overflow-wrap:anywhere}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--sprout)}
.etapas{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.etapas li{display:flex;gap:10px;align-items:flex-start}
.etapas .dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);margin-top:4px}
.etapas li.ok .dot{background:var(--sprout);border-color:var(--sprout)}
.etapas small{color:var(--muted)}
a.chip{text-decoration:none}
</style>
</head>
<body>


<div class="app">
  <header>
    <div class="hin">
      <div class="logo">
        <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><path d="M74 26 A34 34 0 1 0 84 50 L58 50" fill="none" stroke="#F6F5F0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 26 C77 12 88 6 97 4 C95 17 88 25 74 26 Z" fill="#B8E35A"/></svg>
        grovan <span class="tag">Soluções</span>
      </div>
      <div class="sp"></div>
      <button class="iconbtn" id="tema" aria-label="Alternar modo claro e escuro"></button>
    </div>
  </header>
  <main id="main"><div class="feed" id="feed" aria-live="polite"></div></main>
  <footer class="composer">
    <div class="cin">
      <label for="txt" class="sr" style="position:absolute;left:-9999px">Mensagem</label>
      <textarea id="txt" rows="1" placeholder="Digite sua mensagem"></textarea>
      <button class="send" id="enviar" aria-label="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </footer>
</div>

<div class="sheet" id="sheet" hidden>
  <header><div class="hin">
    <button class="iconbtn" id="fechar" aria-label="Voltar para a conversa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h2>Nossos serviços</h2><div class="sp"></div>
  </div></header>
  <main><div id="catalogo"></div></main>
  <div class="sheetfoot"><div class="sfin">
    <div class="sum" id="sum"></div>
    <button class="chip pri" id="confirmar">Ver orçamento</button>
  </div></div>
</div>

<script>
/* ===== CONFIGURAÇÃO (preencha com os dados do seu projeto no Supabase) =====
   Estes dois valores são públicos por natureza: eles só deixam o site chamar a função "portal".
   Preços, portes e chaves ficam no servidor, nunca aqui. */
const CONFIG={
  supabaseUrl:"https://gemsxocgwkpkgapgflkt.supabase.co",
  anonKey:"sb_publishable_CIgMVDHTDKmTEfzttKyCqA_WktHZV13",
  funcao:"funcao-portal-ts"
};
/* ======================================================================== */

const $=q=>document.querySelector(q);
const feed=$("#feed");
const brl=n=>"R$ "+Number(n).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2});
const S={token:null,step:"id",cat:null,sel:new Set(),ultimoId:0,status:null,nome:""};
function esc(t){return String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function scroll(){const m=$("#main");m.scrollTop=m.scrollHeight}
function me(t){feed.insertAdjacentHTML("beforeend",`<div class="msg me"><div class="bub"><p>${esc(t)}</p></div></div>`);scroll()}
const AV=`<div class="av" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 100 100"><path d="M74 26 A34 34 0 1 0 84 50 L58 50" fill="none" stroke="#F6F5F0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 26 C77 12 88 6 97 4 C95 17 88 25 74 26 Z" fill="#B8E35A"/></svg></div>`;
const AV_C=`<div class="av av-c" aria-hidden="true">C</div>`;
function digitando(){const t=document.createElement("div");t.className="msg";t.innerHTML=AV+`<div class="bub typing" aria-label="digitando"><span></span><span></span><span></span></div>`;feed.appendChild(t);scroll();return t}
function bot(html,{quem="ia",demora=0}={}){
  return new Promise(res=>{
    const t=digitando();
    setTimeout(()=>{t.innerHTML=(quem==="cristian"?AV_C:AV)+`<div class="bub">${quem==="cristian"?'<p class="quem">Cristian</p>':""}${html}</div>`;scroll();res(t)},matchMedia("(prefers-reduced-motion:reduce)").matches?0:demora);
  });
}
function chips(el,opts){
  const box=document.createElement("div");box.className="chips";
  opts.forEach(o=>{const b=document.createElement("button");b.className="chip"+(o.pri?" pri":"");b.textContent=o.t;
    b.addEventListener("click",()=>{box.querySelectorAll("button").forEach(x=>x.disabled=true);if(o.eco!==false)me(o.t);o.fn()});box.appendChild(b)});
  el.querySelector(".bub").appendChild(box);scroll();
}
const onlyDigits=t=>String(t).replace(/\D/g,"");

// ---------- servidor
async function api(acao,dados={}){
  const r=await fetch(`${CONFIG.supabaseUrl}/functions/v1/${CONFIG.funcao}`,{method:"POST",
    headers:{"content-type":"application/json",apikey:CONFIG.anonKey,...(CONFIG.anonKey.startsWith("eyJ")?{authorization:"Bearer "+CONFIG.anonKey}:{})},
    body:JSON.stringify({acao,token:S.token,...dados})}).catch(()=>null);
  if(!r)throw new Error("Sem conexão com o servidor. Confira a sua internet e tente de novo.");
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.erro||"Algo deu errado aqui. Tente de novo em instantes.");
  return j;
}
async function tenta(fn){
  const t=digitando();
  try{const r=await fn();t.remove();return r}
  catch(e){t.innerHTML=AV+`<div class="bub"><p>${esc(e.message)}</p></div>`;scroll();return null}
}
function guardaToken(tk){
  S.token=tk;
  try{localStorage.setItem("grovan_atendimento",tk)}catch(e){}
  try{const u=new URL(location.href);u.searchParams.set("c",tk);history.replaceState(null,"",u)}catch(e){}
}
function linkCliente(){try{const u=new URL(location.href);u.search="?c="+S.token;u.hash="";return u.toString()}catch(e){return location.href}}

// ---------- 1) identificação
async function inicio(){
  const el=await bot(`<p>Olá! Eu sou o assistente da <strong>Grovan Soluções</strong>.</p><p>Pra começar, me informa o <strong>nome da empresa e o CNPJ</strong>. Se for pessoa física, o seu <strong>nome e CPF</strong>.</p>
    <form class="form" id="fid"><div><label for="fid-nome">Nome da empresa ou seu nome</label><input id="fid-nome" required autocomplete="organization"></div>
    <div><label for="fid-doc">CNPJ ou CPF</label><input id="fid-doc" required inputmode="numeric" placeholder="Só os números ou com pontos"></div>
    <p id="fid-erro" class="fine" style="color:var(--fg)" hidden></p>
    <button class="chip pri" type="submit">Continuar</button></form>`);
  el.querySelector("#fid").addEventListener("submit",async e=>{
    e.preventDefault();const n=$("#fid-nome").value.trim(),d=$("#fid-doc").value.trim(),er=$("#fid-erro");
    if(!n||!d)return;
    if(![11,14].includes(onlyDigits(d).length)){er.hidden=false;er.textContent="Confere o número: o CNPJ tem 14 dígitos e o CPF tem 11.";return}
    const bts=e.target.querySelectorAll("input,button");bts.forEach(x=>x.disabled=true);er.hidden=true;
    const r=await tenta(()=>api("identificar",{nome:n,documento:d}));
    if(!r){bts.forEach(x=>x.disabled=false);return}
    S.nome=n;me(`${n} · ${d}`);guardaToken(r.token);S.step="conversa";
    $("#txt").placeholder="Escreva o que você precisa";
    const el2=await bot(`<p>${esc(r.saudacao)}</p><p>Pode escrever aqui embaixo com as suas palavras ou ver a lista dos nossos serviços.</p>`,{demora:300});
    chips(el2,[{t:"Ver e escolher os serviços",pri:true,fn:abrirCatalogo}]);
    iniciaAcompanhamento();
  });
  $("#fid-nome").focus();
}

// ---------- 2) catálogo (preços já calculados no servidor para este cliente)
async function abrirCatalogo(){
  if(!S.cat){const r=await tenta(()=>api("catalogo"));if(!r)return;S.cat=r.servicos}
  renderCatalogo();$("#sheet").hidden=false;$("#fechar").focus();
}
function fecharCatalogo(){$("#sheet").hidden=true}
function precoTxt(s){return s.a_combinar?`A combinar<small>${brl(s.valor_hora)}/hora</small>`:`${brl(s.valor)}<small>${s.cobranca==="Mensal"?"por mês":(s.cobranca==="Por lote"?"por lote":(s.cobranca==="Por vídeo"?"por vídeo":"valor fixo"))}</small>`}
function metaTxt(s){
  if(s.entrega)return `<span>Inclui: <b>${esc(s.entrega)}</b></span>`;
  if(s.a_combinar)return `<span>Valor/hora: <b>${brl(s.valor_hora)}</b></span><span>Horas e valor final: <b>definidos na proposta</b></span>`;
  return `<span>Horas: <b>${Number(s.horas).toLocaleString("pt-BR")} h</b></span><span>Valor/hora: <b>${brl(s.valor_hora)}</b></span><span>Cobrança: <b>${esc(s.cobranca)}</b></span>`;
}
function renderCatalogo(){
  const cats=[...new Set(S.cat.map(s=>s.categoria))];
  $("#catalogo").innerHTML=cats.map(c=>`<div class="cat"><h3>${esc(c)}</h3>${S.cat.filter(s=>s.categoria===c).map(s=>{const on=S.sel.has(s.id);
    return `<label class="svc ${on?"on":""}" for="sv-${s.id}"><input type="checkbox" id="sv-${s.id}" data-id="${s.id}" ${on?"checked":""}>
      <div style="min-width:0"><div class="nm">${esc(s.nome)}</div><div class="ds">${esc(s.inclui)}</div><div class="meta">${metaTxt(s)}</div></div>
      <div class="pr">${precoTxt(s)}</div></label>`}).join("")}</div>`).join("");
  $("#catalogo").querySelectorAll("input").forEach(i=>i.addEventListener("change",()=>{const id=+i.dataset.id;i.checked?S.sel.add(id):S.sel.delete(id);renderCatalogo();const n=document.getElementById(i.id);n&&n.focus()}));
  renderSum();
}
function renderSum(){
  const it=S.cat.filter(s=>S.sel.has(s.id));let u=0,m=0,c=0;
  it.forEach(s=>{if(s.a_combinar)c++;else if(s.cobranca==="Mensal")m+=s.valor;else u+=s.valor});
  $("#sum").innerHTML=it.length?`${it.length} serviço${it.length>1?"s":""}${u?` · <b>${brl(u)}</b>`:""}${m?` + <b>${brl(m)}</b>/mês`:""}${c?` + ${c} a combinar`:""}`:`<span style="color:var(--muted)">Marque os serviços que você precisa</span>`;
  $("#confirmar").disabled=!it.length;
}

// ---------- 3) orçamento estimado
function quoteHTML(o,titulo){
  const rows=o.itens.map(s=>{const sub=s.a_combinar?`${brl(s.valor_hora)}/hora · valor final na proposta`:(s.entrega?`Mensal · ${esc(s.entrega)}`:`${Number(s.horas).toLocaleString("pt-BR")} h · ${esc(s.cobranca)}`);
    return `<div class="row"><span>${esc(s.nome)}<small>${sub}</small></span><span class="v">${s.a_combinar?"A combinar":brl(s.valor)+(s.cobranca==="Mensal"?"/mês":"")}</span></div>`}).join("");
  return `<p>${titulo}</p><div class="quote">${rows}
    ${o.unico?`<div class="row tot"><span>Total dos projetos</span><span class="v">${brl(o.unico)}</span></div>`:""}
    ${o.mensal?`<div class="row tot"><span>Mensalidade</span><span class="v">${brl(o.mensal)}/mês</span></div>`:""}
    ${o.combinar?`<div class="row"><span>Itens a combinar<small>O Cristian analisa o seu caso e envia horas, valor e prazo na proposta</small></span><span class="v">${o.combinar}</span></div>`:""}</div>
    ${o.prazo?`<p style="margin-top:10px">Prazo estimado de entrega: <strong>${esc(o.prazo)}</strong>.</p>`:""}
    <p class="fine">Valores e prazo estimados. O Cristian confirma tudo antes de você pagar.</p>`;
}
async function confirmarSelecao(){
  fecharCatalogo();me("Selecionei os serviços");
  const o=await tenta(()=>api("orcamento",{ids:[...S.sel]}));if(!o)return;
  mostraOrcamento(o,"Aqui está o seu orçamento:");
}
async function mostraOrcamento(o,titulo){
  const el=await bot(quoteHTML(o,titulo),{demora:300});
  chips(el,[{t:"Quero este orçamento",pri:true,fn:pedeContato},{t:"Ajustar serviços",fn:abrirCatalogo}]);
}
async function pedeContato(){
  const el=await bot(`<p>Ótimo! Só preciso de um contato pra te avisar quando a proposta estiver confirmada.</p>
    <form class="form" id="fc"><div><label for="fc-nome">Seu nome</label><input id="fc-nome" required autocomplete="name"></div>
    <div><label for="fc-cont">WhatsApp ou e-mail</label><input id="fc-cont" required></div>
    <button class="chip pri" type="submit">Enviar solicitação</button></form>`);
  el.querySelector("#fc").addEventListener("submit",async e=>{
    e.preventDefault();const n=$("#fc-nome").value.trim(),c=$("#fc-cont").value.trim();if(!n||!c)return;
    const bts=e.target.querySelectorAll("input,button");bts.forEach(x=>x.disabled=true);
    const r=await tenta(()=>api("enviar",{nome:n,contato:c}));if(!r){bts.forEach(x=>x.disabled=false);return}
    me(`${n} · ${c}`);
    const el2=await bot(`<p>Pronto, ${esc(n.split(" ")[0])}! Sua solicitação <strong>${esc(r.numero)}</strong> foi enviada.</p>
      <p>O Cristian vai revisar e a proposta confirmada aparece aqui, com o link de pagamento. Guarde este link: é por ele que você acompanha tudo até a entrega.</p>
      <p class="linkbox"><span id="meulink">${esc(linkCliente())}</span></p>`,{demora:300});
    chips(el2,[{t:"Copiar meu link",eco:false,fn:()=>copiar(linkCliente(),el2)}]);
  });
}
function copiar(txt,el){
  const ok=()=>{const b=el.querySelector(".chips button");if(b){b.textContent="Link copiado";}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,()=>seleciona())}else seleciona();
  function seleciona(){const sp=el.querySelector("#meulink");if(!sp)return;const r=document.createRange();r.selectNodeContents(sp);const s=getSelection();s.removeAllRanges();s.addRange(r)}
  el.querySelectorAll(".chips button").forEach(b=>b.disabled=false);
}

// ---------- 4) conversa livre com a IA
async function enviar(){
  const v=$("#txt").value.trim();if(!v)return;
  if(S.step==="id"){$("#txt").value="";autosize();await bot(`<p>Antes, preenche o nome e o CNPJ ou CPF logo acima, por favor.</p>`);return}
  $("#txt").value="";autosize();me(v);
  const r=await tenta(()=>api("mensagem",{texto:v}));if(!r)return;
  await sincroniza(true);
  if(r.orcamento&&r.orcamento.itens.length){S.sel=new Set(r.servicos);mostraOrcamento(r.orcamento,"Pelo que você descreveu, estes serviços resolvem:")}
}
function autosize(){const t=$("#txt");t.style.height="46px";t.style.height=Math.min(t.scrollHeight,140)+"px"}

// ---------- 5) acompanhamento: mensagens do Cristian, proposta, pagamento e andamento
let timer=null,propostaMostrada=null,pagMostrado=null,etapasSig="";
function iniciaAcompanhamento(){if(!timer)timer=setInterval(()=>sincroniza(false),15000)}
async function sincroniza(silencioso){
  let e;try{e=await api("estado",{desde:S.ultimoId})}catch(err){if(!silencioso)return;return}
  for(const m of e.mensagens){
    S.ultimoId=Math.max(S.ultimoId,m.id);
    if(m.autor==="cliente")continue;               // já aparece quando o cliente envia
    if(m.autor==="ia"){await bot(`<p>${esc(m.texto)}</p>`);continue}
    if(m.autor==="cristian"){await bot(`<p>${esc(m.texto).replace(/\n/g,"<br>")}</p>`,{quem:"cristian"});continue}
    feed.insertAdjacentHTML("beforeend",`<p class="aviso">${esc(m.texto)}</p>`);scroll();
  }
  S.status=e.status;
  if(e.proposta&&e.status==="proposta_enviada"&&propostaMostrada!==JSON.stringify(e.proposta)){
    propostaMostrada=JSON.stringify(e.proposta);mostraProposta(e);
  }
  if(e.pagamento&&pagMostrado!==e.pagamento){
    pagMostrado=e.pagamento;
    await bot(`<p>Sua proposta está aprovada. É só concluir o pagamento por Pix ou cartão:</p><p><a class="chip pri pagar" href="${esc(e.pagamento)}" target="_blank" rel="noopener">Pagar agora</a></p><p class="fine">Assim que o pagamento cair, ele aparece confirmado aqui.</p>`);
  }
  const sig=JSON.stringify([e.progresso,e.etapas]);
  if(e.etapas.length&&sig!==etapasSig){etapasSig=sig;mostraAndamento(e)}
}
async function mostraProposta(e){
  const p=e.proposta;
  const rows=p.itens.map(i=>`<div class="row"><span>${esc(i.nome)}${i.quantidade>1?` ×${i.quantidade}`:""}<small>${esc(i.descricao||i.cobranca)}</small></span><span class="v">${i.a_combinar&&i.valor==null?"A combinar":brl(i.valor)+(i.cobranca==="Mensal"?"/mês":"")}</span></div>`).join("");
  const el=await bot(`<p><strong>Proposta ${esc(e.numero)}</strong>${p.condicao_especial?' <span class="badge">Condição especial aplicada</span>':""}</p><div class="quote">${rows}
    ${Number(p.total_unico)?`<div class="row tot"><span>Total</span><span class="v">${brl(p.total_unico)}</span></div>`:""}
    ${Number(p.total_mensal)?`<div class="row tot"><span>Mensalidade</span><span class="v">${brl(p.total_mensal)}/mês</span></div>`:""}</div>
    ${p.prazo?`<p style="margin-top:10px">Prazo: <strong>${esc(p.prazo)}</strong></p>`:""}`,{quem:"cristian"});
  chips(el,[{t:"Aceitar proposta",pri:true,fn:async()=>{const r=await tenta(()=>api("aceitar"));if(r){await bot(`<p>Proposta aceita! Em instantes você recebe aqui o link de pagamento.</p>`);sincroniza(true)}}},
            {t:"Tenho uma dúvida",eco:false,fn:()=>{$("#txt").focus()}}]);
}
async function mostraAndamento(e){
  await bot(`<p><strong>Andamento do seu serviço</strong></p>
    <div class="prog" role="progressbar" aria-valuenow="${e.progresso}" aria-valuemin="0" aria-valuemax="100"><i style="width:${e.progresso}%"></i></div>
    <p class="fine" style="margin-top:4px">${e.progresso}% concluído</p>
    <ul class="etapas">${e.etapas.map(t=>`<li class="${t.concluida?"ok":""}"><span class="dot" aria-hidden="true"></span><span><b>${esc(t.titulo)}</b>${t.detalhe?`<br><small>${esc(t.detalhe)}</small>`:""}</span></li>`).join("")}</ul>`,{quem:"cristian"});
}
async function retomar(tk){
  S.token=tk;S.step="conversa";$("#txt").placeholder="Escreva a sua mensagem";
  try{
    const e=await api("estado",{desde:0});
    await bot(`<p>Olá de novo, <strong>${esc(e.cliente)}</strong>! Este é o atendimento <strong>${esc(e.numero)}</strong>.</p>`);
    for(const m of e.mensagens.slice(-12)){
      if(m.autor==="cliente")me(m.texto);
      else if(m.autor==="cristian")feed.insertAdjacentHTML("beforeend",`<div class="msg">${AV_C}<div class="bub"><p class="quem">Cristian</p><p>${esc(m.texto).replace(/\n/g,"<br>")}</p></div></div>`);
      else if(m.autor==="ia")feed.insertAdjacentHTML("beforeend",`<div class="msg">${AV}<div class="bub"><p>${esc(m.texto)}</p></div></div>`);
      else feed.insertAdjacentHTML("beforeend",`<p class="aviso">${esc(m.texto)}</p>`);
    }
    S.ultimoId=e.mensagens.reduce((a,m)=>Math.max(a,m.id),0);scroll();
    await sincroniza(true);
    if(["em_conversa"].includes(e.status)){const el=await bot(`<p>Quer continuar de onde parou?</p>`);chips(el,[{t:"Ver e escolher os serviços",pri:true,fn:abrirCatalogo}])}
    iniciaAcompanhamento();
  }catch(err){
    try{localStorage.removeItem("grovan_atendimento")}catch(e){}
    await bot(`<p>${esc(err.message)}</p>`);S.token=null;S.step="id";inicio();
  }
}

// ---------- eventos
$("#enviar").addEventListener("click",enviar);
$("#txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar()}});
$("#txt").addEventListener("input",autosize);
$("#fechar").addEventListener("click",fecharCatalogo);
$("#confirmar").addEventListener("click",confirmarSelecao);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.token)sincroniza(true)});

// ---------- tema claro e escuro
const SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function isDark(){const a=document.documentElement.dataset.theme;return a?a==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
function paintTema(){$("#tema").innerHTML=isDark()?SUN:MOON;$("#tema").setAttribute("aria-label",isDark()?"Mudar para modo claro":"Mudar para modo escuro")}
try{const t=localStorage.getItem("grovan_tema");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#tema").addEventListener("click",()=>{const n=isDark()?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("grovan_tema",n)}catch(e){}paintTema()});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",paintTema);
paintTema();

// ---------- início: link com código (?c=) retoma o atendimento; sem código, começa um novo
(function(){
  let tk=null;try{tk=new URL(location.href).searchParams.get("c")}catch(e){}
  if(!tk){try{tk=localStorage.getItem("grovan_atendimento")}catch(e){}}
  // Voltou da página de pagamento da InfinitePay: confere o pagamento e limpa o endereço
  let ret=null;try{const u=new URL(location.href);const keys=["order_nsu","transaction_nsu","transaction_id","slug","invoice_slug","capture_method","receipt_url"];
    if(keys.some(k=>u.searchParams.has(k))){ret={};keys.forEach(k=>{if(u.searchParams.has(k))ret[k]=u.searchParams.get(k)});keys.forEach(k=>u.searchParams.delete(k));history.replaceState(null,"",u)}}catch(e){}
  if(tk&&ret){S.token=tk;api("confirmar_pagamento",{params:ret}).catch(()=>{}).finally(()=>retomar(tk))}
  else if(tk)retomar(tk);else inicio();
})();
</script>
</body>
